services:
  minio:
    image: minio/minio
    hostname: minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ACCESS_KEY: minio1
      MINIO_SECRET_KEY: minio123
    command: server --console-address ":9001" /data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minio1 minio123;
      /usr/bin/mc mb myminio/somebucketname;
      mc encrypt clear myminio/somebucketname;
      exit 0;
      "

  zookeeper:
    image: confluentinc/cp-zookeeper:${CONFLUENT_DOCKER_TAG}
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVERS: zookeeper:2888:3888
      TZ : Europe/Madrid

  broker1:
    image: confluentinc/cp-server:${CONFLUENT_DOCKER_TAG}
    hostname: broker1
    container_name: broker1
    ports:
      - 19091:19091
    environment:
      KAFKA_BROKER_ID: 1
      BROKER_NAME: broker1
      KAFKA_BROKER_RACK: "r1"
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_BOOTSTRAP_SERVERS: broker1:9091,broker2:9091,broker3:9091
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
      KAFKA_CONFLUENT_TIER_FEATURE: true
      KAFKA_CONFLUENT_TIER_CLEANER_FEATURE_ENABLE: true
      KAFKA_CONFLUENT_TIER_CLEANER_ENABLE: false
      KAFKA_CONFLUENT_TIER_ENABLE: false
      KAFKA_CONFLUENT_TIER_BACKEND: S3
      KAFKA_CONFLUENT_TIER_S3_BUCKET: ${BUCKET_NAME}
      KAFKA_CONFLUENT_TIER_S3_REGION: ${REGION}
      KAFKA_CONFLUENT_TIER_S3_SSE_ALGORITHM: "none"
      KAFKA_CONFLUENT_TIER_S3_SSE_CUSTOMER_ENCRYPTION_KEY : null
      KAFKA_CONFLUENT_TIER_S3_AWS_ENDPOINT_OVERRIDE: http://minio:9000/
      KAFKA_CONFLUENT_TIER_S3_FORCE_PATH_STYLE_ACCESS: true
      KAFKA_CONFLUENT_TIER_S3_IPV6_ENABLED: false
      AWS_ACCESS_KEY_ID: minio1
      AWS_SECRET_ACCESS_KEY: minio123
      KAFKA_CONFLUENT_TIER_LOCAL_HOTSET_MS: 60000 # hotset of 1 minute
      KAFKA_CONFLUENT_TIER_TOPIC_DELETE_CHECK_INTERVAL: 300000 # check every 5 min for topic deletion
      KAFKA_CONFLUENT_TIER_METADATA_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_DOCKER_INTERNAL:PLAINTEXT,LISTENER_DOCKER_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_DOCKER_INTERNAL
      KAFKA_ADVERTISED_LISTENERS: LISTENER_DOCKER_INTERNAL://broker1:9091,LISTENER_DOCKER_EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:19091
      KAFKA_METRIC_REPORTERS: io.confluent.telemetry.reporter.TelemetryReporter
      KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker1:9091,broker2:9091,broker3:9091
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_SEGMENT_BYTES: 10485760 # 10 MB log segments
      KAFKA_LOG_RETENTION_MS: 600000 # 10 minute retention
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000 # Check retention every 5 seconds
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_TYPE: http
